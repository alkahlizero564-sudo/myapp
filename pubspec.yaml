name: my_apps
description: My apps - build Flutter apps with AI and ship signed APKs from your phone.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  archive: ^3.6.1
  shelf: ^1.4.1
  shelf_static: ^1.1.3
  webview_flutter: ^4.10.0
  open_filex: ^4.5.0

flutter:
  uses-material-design: true
